name: Release

# Pushing a tag that is the bare version (0.2.0, no "v") builds the plugin
# and creates a draft release with main.js and manifest.json attached and
# the tag's section of CHANGELOG.md as notes.
on:
    push:
        tags: ["[0-9]+.[0-9]+.[0-9]+"]

# Building runs third-party code (npm packages), so it gets a read-only
# token; only the job that creates the release can write, and it runs
# nothing but gh.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm
            - name: Check that the tag matches the version files
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  node -e '
                    const fs = require("fs");
                    const tag = process.env.TAG;
                    const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
                    const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
                    const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
                    const errors = [];
                    if (manifest.version !== tag) errors.push(`manifest.json has ${manifest.version}`);
                    if (pkg.version !== tag) errors.push(`package.json has ${pkg.version}`);
                    if (versions[tag] !== manifest.minAppVersion) errors.push(`versions.json lacks "${tag}": "${manifest.minAppVersion}"`);
                    if (errors.length) { console.error(`Tag ${tag}: ${errors.join("; ")}`); process.exit(1); }
                  '
            - run: npm ci
            # Typecheck, lint, format check, tests and production build.
            - run: npm run check
            # The release notes are the tag's section of CHANGELOG.md, from
            # its "## <tag>" heading to the next "## " heading. After the
            # check, so that the format check does not see release-notes.md.
            - name: Take the release notes from the changelog
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  node -e '
                    const fs = require("fs");
                    const tag = process.env.TAG;
                    const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
                    const start = lines.findIndex((line) => line === `## ${tag}` || line.startsWith(`## ${tag} `));
                    if (start < 0) { console.error(`CHANGELOG.md has no "## ${tag}" section`); process.exit(1); }
                    const rest = lines.slice(start + 1);
                    const end = rest.findIndex((line) => line.startsWith("## "));
                    const notes = (end < 0 ? rest : rest.slice(0, end)).join("\n").trim();
                    if (!notes) { console.error(`The "## ${tag}" section of CHANGELOG.md is empty`); process.exit(1); }
                    fs.writeFileSync("release-notes.md", notes + "\n");
                  '
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: plugin
                  path: |
                      main.js
                      manifest.json
                      release-notes.md
                  if-no-files-found: error
                  retention-days: 1

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: plugin
            - name: Create a draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes-file release-notes.md main.js manifest.json
