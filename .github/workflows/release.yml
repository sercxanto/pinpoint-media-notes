name: Release

# Pushing a tag that is the bare version (0.2.0, no "v") builds the plugin
# and creates a draft release with main.js and manifest.json attached.
on:
    push:
        tags: ["[0-9]+.[0-9]+.[0-9]+"]

# Building runs third-party code (npm packages), so it gets a read-only
# token; only the job that creates the release can write, and it runs
# nothing but gh.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm
            - name: Check that the tag matches the version files
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  node -e '
                    const fs = require("fs");
                    const tag = process.env.TAG;
                    const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
                    const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
                    const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
                    const errors = [];
                    if (manifest.version !== tag) errors.push(`manifest.json has ${manifest.version}`);
                    if (pkg.version !== tag) errors.push(`package.json has ${pkg.version}`);
                    if (versions[tag] !== manifest.minAppVersion) errors.push(`versions.json lacks "${tag}": "${manifest.minAppVersion}"`);
                    if (errors.length) { console.error(`Tag ${tag}: ${errors.join("; ")}`); process.exit(1); }
                  '
            - run: npm ci
            # Typecheck, lint, format check, tests and production build.
            - run: npm run check
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: plugin
                  path: |
                      main.js
                      manifest.json
                  if-no-files-found: error
                  retention-days: 1

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: plugin
            - name: Create a draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --generate-notes main.js manifest.json
