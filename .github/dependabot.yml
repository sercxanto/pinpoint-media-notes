version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions:
              patterns: ["*"]
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      ignore:
          # Majors are held back on purpose, see "TypeScript 6.0, ESLint 9"
          # in CONTRIBUTING.md.
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
      groups:
          npm:
              patterns: ["*"]
